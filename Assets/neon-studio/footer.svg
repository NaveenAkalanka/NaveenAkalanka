<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Always curious. Always building."><style>
text{font-family:Segoe UI,Arial,sans-serif} .flow{stroke-dasharray:9 19;animation:flow 4s linear infinite} .pulse{animation:pulse 4s ease-in-out infinite} .orbit{transform-origin:center;transform-box:fill-box;animation:orbit 24s linear infinite}
@keyframes flow{to{stroke-dashoffset:-112}} @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}} @keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit{animation:none}}
</style><defs><linearGradient id="g"><stop stop-color="#42e8e0"/><stop offset=".5" stop-color="#a88bff"/><stop offset="1" stop-color="#ff78b6"/></linearGradient></defs><rect width="1200" height="150" rx="18" fill="#0b1221"/><path class="flow" d="M0 125Q300 55 600 125T1200 125" fill="none" stroke="url(#g)" stroke-width="3"/><text x="600" y="61" text-anchor="middle" fill="#eef3ff" font-size="28" font-weight="600">Always curious. Always building.</text><text x="600" y="94" text-anchor="middle" fill="#a88bff" font-size="17" letter-spacing="2">SELF-HOSTED / OPEN SOURCE / MADE WITH PURPOSE</text></svg>
