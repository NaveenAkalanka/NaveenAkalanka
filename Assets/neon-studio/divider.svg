<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="32" viewBox="0 0 1200 32" role="img" aria-label="Animated multicolor divider"><style>
text{font-family:Segoe UI,Arial,sans-serif} .flow{stroke-dasharray:9 19;animation:flow 4s linear infinite} .pulse{animation:pulse 4s ease-in-out infinite} .orbit{transform-origin:center;transform-box:fill-box;animation:orbit 24s linear infinite}
@keyframes flow{to{stroke-dashoffset:-112}} @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}} @keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit{animation:none}}
</style><defs><linearGradient id="g"><stop stop-color="#42e8e0"/><stop offset=".45" stop-color="#a88bff"/><stop offset=".7" stop-color="#ff78b6"/><stop offset="1" stop-color="#ffd17b"/></linearGradient></defs><path d="M0 16H1200" stroke="#243047" stroke-width="2"/><path class="flow" d="M0 16H1200" stroke="url(#g)" stroke-width="2"/></svg>
