<svg xmlns="http://www.w3.org/2000/svg" width="640" height="785" viewBox="0 0 640 785" role="img" aria-label="Infrastructure, cloud, automation, development and design tools"><style>
text{font-family:Segoe UI,Arial,sans-serif} .flow{stroke-dasharray:9 19;animation:flow 4s linear infinite} .pulse{animation:pulse 4s ease-in-out infinite} .orbit{transform-origin:center;transform-box:fill-box;animation:orbit 24s linear infinite}
