<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Home lab focus areas: Proxmox, networking, services and automation. Conceptual illustration."><style>
text{font-family:Segoe UI,Arial,sans-serif} .flow{stroke-dasharray:9 19;animation:flow 4s linear infinite} .pulse{animation:pulse 4s ease-in-out infinite} .orbit{transform-origin:center;transform-box:fill-box;animation:orbit 24s linear infinite}
@keyframes flow{to{stroke-dashoffset:-112}} @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}} @keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit{animation:none}}
</style><defs><linearGradient id="edge"><stop stop-color="#42e8e0"/><stop offset=".5" stop-color="#a88bff"/><stop offset="1" stop-color="#ff78b6"/></linearGradient></defs><rect x="1" y="1" width="1198" height="328" rx="18" fill="#0b1221" stroke="#344161"/><text x="32" y="44" fill="#8fa4c6" font-size="16" letter-spacing="3">MY LAB / EXPLORE → TEST → AUTOMATE</text><path d="M75 184H1125" fill="none" stroke="#303d5b" stroke-width="3"/><path class="flow" d="M75 184H1125" fill="none" stroke="url(#edge)" stroke-width="3"/><rect x="30" y="94" width="340" height="130" rx="14" fill="#131e32" stroke="#42e8e0" stroke-opacity=".6"/><text x="52" y="129" fill="#42e8e0" font-size="18">01 /</text><circle cx="345" cy="121" r="5" fill="#42e8e0" class="pulse"/><text x="52" y="165" fill="#eef3ff" font-weight="700" font-size="22">PROXMOX LAB</text><text x="52" y="198" fill="#adc0df" font-size="17">Virtual machines · LXC · Linux</text><rect x="430" y="94" width="340" height="130" rx="14" fill="#131e32" stroke="#a88bff" stroke-opacity=".6"/><text x="452" y="129" fill="#a88bff" font-size="18">02 /</text><circle cx="745" cy="121" r="5" fill="#a88bff" class="pulse"/><text x="452" y="165" fill="#eef3ff" font-weight="700" font-size="22">NETWORK &amp; SERVICES</text><text x="452" y="198" fill="#adc0df" font-size="17">Containers · Storage · Networking</text><rect x="830" y="94" width="340" height="130" rx="14" fill="#131e32" stroke="#ff78b6" stroke-opacity=".6"/><text x="852" y="129" fill="#ff78b6" font-size="18">03 /</text><circle cx="1145" cy="121" r="5" fill="#ff78b6" class="pulse"/><text x="852" y="165" fill="#eef3ff" font-weight="700" font-size="22">AUTOMATION</text><text x="852" y="198" fill="#adc0df" font-size="17">Ansible · Workflows · Cloud</text><text x="32" y="305" fill="#8fa4c6" font-size="15">A place to experiment, break things, and build them better.</text></svg>
